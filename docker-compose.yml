services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beauty_championship
    ports:
      # внешний порт не 5432 (часто занят локальным Postgres); при конфликте смените левое число
      - '5434:5432'
    volumes:
      - beauty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/beauty_championship?schema=public
      JWT_SECRET: docker-dev-secret-replace-in-production
      CORS_ORIGIN: http://localhost:5173
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  beauty_pg_data:
